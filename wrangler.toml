name = "contact-backend"
main = "src/index.ts"
compatibility_date = "2025-12-22"

# Secrets (configure via: wrangler secret put <NAME>)
# - CONTACT_SECRET: Secret required in request body
# - GITHUB_TOKEN: Personal Access Token for creating issues
# - GITHUB_OWNER: GitHub repository owner
# - GITHUB_REPO: GitHub repository name
# - TELEGRAM_BOT_TOKEN: Bot token for Telegram notifications (optional)
# - TELEGRAM_CHAT_ID: Chat ID for Telegram messages (optional)

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "ff5439c851a144658f0c638eacaa8419"

# D1 database for persistence
[[d1_databases]]
binding = "DB"
database_name = "contact_backend"
database_id = "cb6d52a2-8fd8-4bef-b999-e9e12233f58e"

[vars]
# Origins are comma-separated
ALLOWED_ORIGINS = "https://yuchdev.github.io"

# Optional configuration (with defaults)
USE_D1 = "true"
DEDUPE_TTL_SECONDS = "86400"
RATE_LIMIT_PER_MINUTE = "10"
MAX_BODY_BYTES = "8192"
MODERATION_MODE = "heuristic"
