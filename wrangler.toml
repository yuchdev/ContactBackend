name = "contact-backend"
main = "src/index.ts"
compatibility_date = "2025-12-22"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "<your-kv-namespace-id>"

# D1 database for persistence
[[d1_databases]]
binding = "DB"
database_name = "contact_backend"
database_id = "<your-d1-database-id>"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# Public template with placeholder IDs. Copy to wrangler.local.toml (gitignored)
# and fill in real IDs plus ALLOWED_ORIGINS, GITHUB_OWNER, GITHUB_REPO and
# TELEGRAM_CHAT_ID under [vars]. npm scripts use wrangler.local.toml.
[vars]
USE_D1 = "true"
DEDUPE_TTL_SECONDS = "86400"
MAX_BODY_BYTES = "8192"
RATE_LIMIT_PER_MINUTE = "10"
MODERATION_MODE = "heuristic"

[env.dev]
name = "contact-backend-dev"
